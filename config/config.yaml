app:
  name: "Hotel Cancellation & Overbooking Glide Path API"
  version: "0.1.0"
  host: "0.0.0.0"
  port: 8000
  debug: true

paths:
  raw_data_path: "data/raw/hotel_bookings.csv"
  processed_data_dir: "data/processed"
  model_artifacts_dir: "models/artifacts"

data:
  target_column: "is_canceled"
  
  cleaning:
    adr_min: 0.0
    adr_max: 1000.0

  # Excluded features: critical target leakage and check-in partial leakage
  excluded_features:
    - reservation_status           # 100% target leakage (Cramér's V = 1.0)
    - reservation_status_date      # Post-event status change timestamp
    - assigned_room_type           # Check-in room allocation leakage
    - required_car_parking_spaces  # Partial leakage (0 cancellations when >0)
    - total_of_special_requests    # Partial operational check-in leakage

  # Features available at booking time
  booking_features:
    categorical:
      - hotel
      - meal
      - country
      - market_segment
      - distribution_channel
      - is_repeated_guest
      - reserved_room_type
      - deposit_type
      - customer_type
    raw_numerical:
      - lead_time
      - stays_in_weekend_nights
      - stays_in_week_nights
      - adults
      - children
      - babies
      - previous_cancellations
      - previous_bookings_not_canceled
      - booking_changes
      - days_in_waiting_list
      - adr
    engineered_numerical:
      - total_stay_nights          # Composite: stays_in_weekend_nights + stays_in_week_nights
      - total_guests               # Composite: adults + children + babies
      - week_sin                   # Cyclical week seasonality
      - week_cos                   # Cyclical week seasonality
      - includes_weekend           # Binary flag: stays_in_weekend_nights >= 1
  
  # Temporal columns defining arrival timing (used for engineering cyclical features)
  temporal_features:
    - arrival_date_year
    - arrival_date_month
    - arrival_date_week_number
    - arrival_date_day_of_month

# Core economics and asymmetric loss parameters (Newsvendor formulation)
economics:
  cost_unbooked_p50:
    Resort Hotel: 75.00
    City Hotel: 100.00
  cost_overbook_premium_p75_minus_p50:
    Resort Hotel: 50.00
    City Hotel: 26.00
  walk_friction_penalty: 25.00  # Transport, voucher, and goodwill protection

models:
  individual_cancellation:
    model_type: "lightgbm"
    threshold: 0.40
    test_size: 0.20
    random_state: 42
    n_estimators: 200
    learning_rate: 0.08
    num_leaves: 31
    artifact_filename: "lightgbm_cancellation_pipeline.joblib"
  
  glide_path:
    hotel_capacity:
      Resort Hotel: 200
      City Hotel: 300
    lead_time_buckets:
      - min_days: 90
        max_days: null
        max_overbooking_factor: 1.25
      - min_days: 30
        max_days: 89
        max_overbooking_factor: 1.15
      - min_days: 7
        max_days: 29
        max_overbooking_factor: 1.05
      - min_days: 0
        max_days: 6
        max_overbooking_factor: 1.00
    default_target_service_level: 0.95
