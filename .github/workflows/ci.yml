name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --dev

      - name: Ruff Linter Check
        run: uv run ruff check .

      - name: Ruff Formatter Check
        run: uv run ruff format --check .

  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-format]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --dev

      - name: Execute Pytest Suite
        run: uv run pytest -v

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: hotel-cancellation-prediction:ci-test

      - name: Container Smoke Test & Health Check
        run: |
          docker run -d --name test-api -p 8000:8000 hotel-cancellation-prediction:ci-test
          sleep 5
          docker logs test-api
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:8000/model/info || exit 1
          docker stop test-api
          docker rm test-api
