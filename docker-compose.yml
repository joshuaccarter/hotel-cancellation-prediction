services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hotel-cancellation-prediction:latest
    container_name: hotel-cancellation-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
